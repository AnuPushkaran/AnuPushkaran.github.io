<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Iframes with Sample Content</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
            background: #333;
            color: white;
            margin: 0;
            padding: 15px;
        }

        .container {
            display: flex;
            gap: 10px;
            padding: 10px;
            height: calc(100vh - 70px);
        }

        iframe {
            flex: 1;
            border: 2px solid #999;
            border-radius: 8px;
            background: white;
        }
    </style>
</head>
<body>

<h1>Sample Page with Two Iframes</h1>

<div class="container">

    <iframe
        title="Frame 1"
        srcdoc="
        <!DOCTYPE html>
        <html>
        <head>
            <style>
                body{
                    font-family:Arial;
                    background:#E8F5E9;
                    padding:20px;
                }
                h2{color:#2E7D32;}
                table{
                    width:100%;
                    border-collapse:collapse;
                }
                th,td{
                    border:1px solid #999;
                    padding:8px;
                }
                th{
                    background:#4CAF50;
                    color:white;
                }
            </style>
        </head>
        <body>
            <h2>Employee Details</h2>

            <table>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                </tr>
                <tr>
                    <td>101</td>
                    <td>Alice</td>
                    <td>Engineering</td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Bob</td>
                    <td>Marketing</td>
                </tr>
                <tr>
                    <td>103</td>
                    <td>Charlie</td>
                    <td>Finance</td>
                </tr>
            </table>

            <p>This iframe contains a sample employee table.</p>
        </body>
        </html>">
    </iframe>

    <iframe
        title="Frame 2"
        srcdoc="
        <!DOCTYPE html>
        <html>
        <head>
            <style>
                body{
                    font-family:Arial;
                    background:#E3F2FD;
                    padding:20px;
                }
                h2{
                    color:#1565C0;
                }
                .card{
                    background:white;
                    border-radius:8px;
                    padding:15px;
                    margin-bottom:15px;
                    box-shadow:0 2px 6px rgba(0,0,0,.15);
                }
                button{
                    background:#1976D2;
                    color:white;
                    border:none;
                    padding:10px 18px;
                    border-radius:4px;
                    cursor:pointer;
                }
            </style>
        </head>
        <body>

            <h2>Announcements</h2>

            <div class='card'>
                <h3>Project Status</h3>
                <p>Project Alpha is <b>80% complete</b>.</p>
            </div>

            <div class='card'>
                <h3>Upcoming Meeting</h3>
                <p>Team Sync: Monday, 10:00 AM</p>
            </div>

            <button onclick='alert(&quot;Hello from Frame 2!&quot;)'>
                Click Me
            </button>

        </body>
        </html>">
    </iframe>

</div>

</body>
</html>
